services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: subway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: subway
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subway -d subway"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: ./server
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVER_ADDRESS: 0.0.0.0
      SUPABASE_DB_URL: jdbc:postgresql://db:5432/subway
      SUPABASE_DB_USER: subway
      SUPABASE_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
