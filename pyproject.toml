[tool.ruff]
target-version = "py310"
line-length = 100
include = ["deploy/**/*.py", "data/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests import the repository's standalone CLI modules after adding deploy/ to sys.path.
"data/tests/*.py" = ["E402"]
