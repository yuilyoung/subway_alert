# Local development only. This does not create a public endpoint or a tunnel.
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: subway-alert-backend:local
    ports:
      - target: 8080
        published: "${BACKEND_PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      PORT: "8080"
      SEOUL_SUBWAY_KEY: "sample"
      FCM_ENABLED: "false"
      SUBWAY_API_TOKENS: "${SUBWAY_API_TOKENS:-}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Djava.io.tmpdir=/tmp"
    init: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
