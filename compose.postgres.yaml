# Optional local receipt durability. Start with compose.yaml and a private
# --env-file created by deploy/generate_api_tokens.py --postgres.
# Direct/session connections only; one backend may hold this database at once.
services:
  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONITOR_STORE: "postgres"
      MONITOR_DB_URL: "jdbc:postgresql://db:5432/subway_alert"
      MONITOR_DB_USER: "subway_alert"
      MONITOR_DB_PASSWORD: "${MONITOR_DB_PASSWORD:?Generate a private PostgreSQL environment file first}"
      SEOUL_SUBWAY_KEY: "sample"
      FCM_ENABLED: "false"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "subway_alert"
      POSTGRES_USER: "subway_alert"
      POSTGRES_PASSWORD: "${MONITOR_DB_PASSWORD:?Generate a private PostgreSQL environment file first}"
    # Deliberately no host port; the backend uses the private Compose network.
    volumes:
      - monitor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "subway_alert", "-d", "subway_alert"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"
    stop_grace_period: 20s

volumes:
  monitor-db:
