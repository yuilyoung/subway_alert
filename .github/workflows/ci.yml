name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      firebase_android:
        description: Include Firebase Android client configuration in the internal test APK
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mobile-domain-and-data:
    name: Mobile domain and sample data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile domain tests
        working-directory: mobile
        run: npm test
      - name: Bundle Android JavaScript
        working-directory: mobile
        run: npx expo export --platform android
      - name: Sample station data tests
        run: python3 -m unittest discover -s data/tests -v

  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test server
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke test packaged API and mobile registration recovery
        run: python3 deploy/smoke_api_access.py --mobile-client --jar server/target/subway-alert-server-0.1.0.jar
      - name: Run standalone tracking engine tests
        working-directory: server
        run: |
          mkdir -p /tmp/subway-server-test
          javac -d /tmp/subway-server-test \
            src/main/java/com/subwayalert/server/domain/TrackingEngine.java \
            src/test/java/com/subwayalert/server/domain/TrackingEngineTest.java
          java -cp /tmp/subway-server-test com.subwayalert.server.domain.TrackingEngineTest

  docker-backend:
    name: ${{ matrix.job_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            job_name: Docker backend runtime and API checks
            artifact: backend-docker-smoke
          - runner: ubuntu-24.04-arm
            job_name: Docker backend runtime and API checks (arm64)
            artifact: backend-docker-smoke-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker tools
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version --short
          python3 --version
      - name: Build and test the isolated backend container
        run: python3 deploy/smoke_compose.py --report artifacts/docker-smoke.json
      - name: Verify draft schema ownership and slot constraints in PostgreSQL
        if: matrix.runner == 'ubuntu-latest'
        run: python3 supabase/tests/test_schema.py -v
      - name: Upload Docker runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: artifacts/docker-smoke.json
          if-no-files-found: error
          retention-days: 14

  android-test-apk:
    # A normal assembleDebug APK generally needs Metro. Build the release
    # variant to embed JavaScript, but retain Expo's generated debug signing.
    # This is an internal test artifact, never a Google Play release.
    name: Standalone Android test APK (ARM64, debug signed)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APK_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.firebase_android && 'subway-alert-firebase-test-arm64' || 'subway-alert-test-arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Prepare Firebase Android client configuration
        if: github.event_name == 'workflow_dispatch' && inputs.firebase_android
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          python3 deploy/prepare_android_firebase.py "$RUNNER_TEMP/subway-android-google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/subway-android-google-services.json" >> "$GITHUB_ENV"
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --no-install --platform android
      - name: Build standalone test APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify APK and prepare download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          apk="artifacts/$APK_NAME.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          python3 - "$apk" <<'PYTHON'
          import os, re, subprocess, sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as apk:
              assert apk.testzip() is None, 'APK archive is corrupt'
              assert apk.getinfo('assets/index.android.bundle').file_size > 0, 'JavaScript bundle is missing'
          aapt2 = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '36.0.0', 'aapt2')
          listing = subprocess.check_output([aapt2, 'dump', 'resources', '--no-values', path], text=True)
          names = set(re.findall(r'^\s*resource\s+0x[0-9a-fA-F]+\s+string/([A-Za-z0-9_]+)\b', listing, re.M))
          expected = {'google_app_id', 'gcm_defaultSenderId', 'google_api_key', 'project_id'}
          configured = os.environ['APK_NAME'] == 'subway-alert-firebase-test-arm64'
          if not names or (configured and not expected <= names) or (not configured and 'google_app_id' in names):
              sys.exit('Packaged Firebase Android resources do not match the selected APK mode.')
          PYTHON
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > artifacts/SHA256SUMS.txt
          cat > artifacts/TEST-BUILD.txt <<'EOF'
          Internal test APK for ARM64 Android 7.0+, with embedded JavaScript.
          Expo's generated Android Debug key signs this release variant for internal testing only.
          Actual subway alighting alerts remain disabled. Sample/test features are unreliable travel guidance.
          EOF
          if [[ "$APK_NAME" == "subway-alert-firebase-test-arm64" ]]; then
            echo "Includes Firebase Android client configuration for device FCM tests. Delivery requires a configured backend and physical device." >> artifacts/TEST-BUILD.txt
          else
            echo "Firebase Android client configuration is absent. Use the Firebase-enabled test APK for device FCM tests." >> artifacts/TEST-BUILD.txt
          fi
      - name: Remove staged Firebase client files
        if: always() && github.event_name == 'workflow_dispatch' && inputs.firebase_android
        run: rm -f "$RUNNER_TEMP/subway-android-google-services.json" mobile/android/app/google-services.json
      - name: Upload internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ github.run_number }}
          path: |
            artifacts/${{ env.APK_NAME }}.apk
            artifacts/SHA256SUMS.txt
            artifacts/TEST-BUILD.txt
          if-no-files-found: error
          retention-days: 14
