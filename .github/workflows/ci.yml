name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-domain-and-data:
    name: Mobile domain and sample data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile domain tests
        working-directory: mobile
        run: npm test
      - name: Bundle Android JavaScript
        working-directory: mobile
        run: npx expo export --platform android
      - name: Sample station data tests
        run: python3 -m unittest discover -s data/tests -v

  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test server
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Smoke test packaged API authentication and limits
        run: python3 deploy/smoke_api_access.py --jar server/target/subway-alert-server-0.1.0.jar
      - name: Run standalone tracking engine tests
        working-directory: server
        run: |
          mkdir -p /tmp/subway-server-test
          javac -d /tmp/subway-server-test \
            src/main/java/com/subwayalert/server/domain/TrackingEngine.java \
            src/test/java/com/subwayalert/server/domain/TrackingEngineTest.java
          java -cp /tmp/subway-server-test com.subwayalert.server.domain.TrackingEngineTest

  postgres-durability:
    name: Real PostgreSQL durable receipt integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: subway_alert_test
          POSTGRES_USER: subway_alert_test
          # Disposable isolated CI service only; never a deployment credential.
          POSTGRES_PASSWORD: durable-ci-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U subway_alert_test -d subway_alert_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Package server with tests
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify real receipt durability and storage outage behavior
        env:
          TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        # Construct the URL inside the process: Actions otherwise prints step
        # environment values. Mask it before launching any child process.
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          environment = dict(os.environ)
          environment.update(
              SUBWAY_POSTGRES_TEST_ONLY='1',
              MONITOR_DB_URL='jdbc:postgresql://' + '127.0.0.1:' + os.environ['TEST_POSTGRES_PORT'] + '/subway_alert_test',
              MONITOR_DB_USER='subway_alert_test',
              MONITOR_DB_PASSWORD='durable-ci-test-only',
          )
          for name in ('MONITOR_DB_URL', 'MONITOR_DB_PASSWORD'):
              print('::add-mask::' + environment[name], flush=True)
          raise SystemExit(subprocess.run([
              sys.executable, 'deploy/smoke_postgres.py', '--jar',
              'server/target/subway-alert-server-0.1.0.jar',
          ], env=environment, check=False).returncode)
          PY

  docker-backend:
    name: Docker backend runtime and API checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker tools
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version --short
          python3 --version
      - name: Build and test the isolated backend container
        run: python3 deploy/smoke_compose.py --report artifacts/docker-smoke.json
      - name: Upload Docker runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-smoke-${{ github.run_number }}
          path: artifacts/docker-smoke.json
          if-no-files-found: error
          retention-days: 14

  android-test-apk:
    # A normal assembleDebug APK generally needs Metro. Build the release
    # variant to embed JavaScript, but retain Expo's generated debug signing.
    # This is an internal test artifact, never a Google Play release.
    name: Standalone Android test APK (ARM64, debug signed)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and generate Android project
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --no-install --platform android
      - name: Build standalone test APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify APK and prepare download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/subway-alert-test-arm64.apk
          python3 - <<'PY'
          import zipfile
          path = 'artifacts/subway-alert-test-arm64.apk'
          with zipfile.ZipFile(path) as apk:
              assert apk.testzip() is None, 'APK archive is corrupt'
              assert apk.getinfo('assets/index.android.bundle').file_size > 0, 'JavaScript bundle is missing'
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/subway-alert-test-arm64.apk
          sha256sum artifacts/subway-alert-test-arm64.apk > artifacts/SHA256SUMS.txt
          cat > artifacts/TEST-BUILD.txt <<'EOF'
          Internal test APK only. ARM64 Android 7.0+ device required.
          JavaScript is embedded; Metro is not required.
          The release variant is signed with Expo's generated Android Debug key.
          This is not a production signing key and must not be submitted to Google Play.
          Firebase configuration and credentials are not included in this CI build.
          FCM token registration/remote notification delivery cannot be tested with this APK.
          Actual subway alighting alerts remain disabled; sample/test features are not reliable travel guidance.
          EOF
      - name: Upload internal test APK
        uses: actions/upload-artifact@v4
        with:
          name: subway-alert-test-arm64-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
